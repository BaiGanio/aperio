<!doctype html>
<meta charset="utf-8">
<title>Aperio media generation pipeline — preview</title>
<style>
  :root{--paper:#f8f5e8;--ink:#212020;--sage:#f0f1e0;--peach:#f8e9d9;--blue:#eef2f4;--lav:#e9e1ea;--loop:3000ms}
  *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Comic Sans MS",cursive}
  .wrap{width:1200px;margin:auto;padding:42px 46px 55px}h1{font-size:48px;margin:0 0 6px;text-align:right}h2{font-size:25px;margin:0 0 8px;text-align:center}p{margin:4px 0 0;opacity:.68;text-align:center;font-size:15px}
  svg{display:block;width:1108px;height:650px;border:0}.panel{stroke:var(--ink);stroke-width:2.2;rx:18}.card{fill:#faf7eb;stroke:var(--ink);stroke-width:1.7;rx:9}.line{fill:none;stroke:var(--ink);stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-dasharray:7 6}
  .dot{offset-rotate:0deg;animation:travel var(--t) linear infinite,breathe 750ms ease-in-out infinite}.d2{animation-delay:-900ms}.d3{animation-delay:-1600ms}@keyframes travel{from{offset-distance:0%}to{offset-distance:100%}}@keyframes breathe{50%{transform:scale(1.35)}}.pulse{animation:pulse 1500ms ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.1)}}
  .small{font-size:14px}.label{font-size:16px}.mono{font-family:ui-monospace,monospace;font-size:13px}.num{fill:var(--paper);font-weight:bold;font-size:18px;text-anchor:middle}
</style>
<div class="wrap"><h1>Aperio makes media memorable ✦</h1><p style="text-align:right">reasoning model → safe job → local renderer → artifact → memory</p>
<svg viewBox="0 0 1108 650" aria-label="Animated Aperio local media generation architecture">
  <defs><marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6.5" orient="auto"><path d="M0 0L10 4L0 8Z" fill="var(--ink)"/></marker></defs>
  <rect width="1108" height="650" fill="var(--paper)"/>
  <rect class="panel" x="35" y="52" width="300" height="185" fill="var(--sage)"/><circle cx="65" cy="82" r="15" fill="var(--ink)"/><text class="num" x="65" y="88">1</text><text x="185" y="88" text-anchor="middle" font-size="25" font-weight="bold">Aperio brain</text><text x="185" y="113" text-anchor="middle" class="small">Gemma 4 / Ornith</text>
  <rect class="card" x="65" y="145" width="240" height="54"/><text class="label" x="185" y="178" text-anchor="middle">prompt + safe preset</text>
  <rect class="panel" x="404" y="52" width="300" height="185" fill="var(--peach)"/><circle cx="434" cy="82" r="15" fill="var(--ink)"/><text class="num" x="434" y="88">2</text><text x="554" y="88" text-anchor="middle" font-size="25" font-weight="bold">Media queue</text><text x="554" y="113" text-anchor="middle" class="small">bounded + cancellable</text>
  <rect class="card" x="434" y="145" width="240" height="54"/><text class="label" x="554" y="178" text-anchor="middle">queued → running → done</text>
  <rect class="panel" x="773" y="52" width="300" height="185" fill="var(--blue)"/><circle cx="803" cy="82" r="15" fill="var(--ink)"/><text class="num" x="803" y="88">3</text><text x="923" y="88" text-anchor="middle" font-size="25" font-weight="bold">Local renderer</text><text x="923" y="113" text-anchor="middle" class="small">ComfyUI workflow adapter</text>
  <rect class="card" x="803" y="135" width="105" height="62"/><text class="label" x="855" y="164" text-anchor="middle">IMAGE</text><text class="small" x="855" y="183" text-anchor="middle">FLUX / Qwen</text><rect class="card" x="923" y="135" width="105" height="62"/><text class="label" x="975" y="164" text-anchor="middle">VIDEO</text><text class="small" x="975" y="183" text-anchor="middle">Wan / LTX</text>
  <path id="e1" class="line" d="M335 145 Q370 125 404 145"/><path id="e2" class="line" d="M704 145 Q738 125 773 145"/><circle class="dot" r="5" fill="#5f7a4a" stroke="var(--paper)" stroke-width="3" style="offset-path:path('M335 145 Q370 125 404 145');--t:1000ms"/><circle class="dot d2" r="5" fill="#bf7350" stroke="var(--paper)" stroke-width="3" style="offset-path:path('M704 145 Q738 125 773 145');--t:1000ms"/>
  <path id="e3" class="line" d="M923 237 Q890 300 760 330 Q620 365 475 330 Q360 300 185 237"/><circle class="dot d3" r="5" fill="#7d6a99" stroke="var(--paper)" stroke-width="3" style="offset-path:path('M923 237 Q890 300 760 330 Q620 365 475 330 Q360 300 185 237');--t:3000ms"/><text x="570" y="355" text-anchor="middle" class="small">deliverable + provenance returns to Aperio memory</text>
  <rect class="panel" x="112" y="405" width="295" height="165" fill="var(--lav)"/><circle cx="142" cy="435" r="15" fill="var(--ink)"/><text class="num" x="142" y="441">4</text><text x="260" y="441" text-anchor="middle" font-size="25" font-weight="bold">Artifact vault</text><text x="260" y="468" text-anchor="middle" class="small">protected path + manifest</text><rect class="card" x="145" y="495" width="230" height="45"/><text class="mono" x="260" y="523" text-anchor="middle">seed · model · workflow hash</text>
  <rect class="panel" x="500" y="405" width="295" height="165" fill="var(--sage)"/><circle cx="530" cy="435" r="15" fill="var(--ink)"/><text class="num" x="530" y="441">5</text><text x="647" y="441" text-anchor="middle" font-size="25" font-weight="bold">Memory layer</text><text x="647" y="468" text-anchor="middle" class="small">prompt, result, visual notes</text><rect class="card" x="532" y="495" width="230" height="45"/><text class="label" x="647" y="523" text-anchor="middle">every run can be recalled</text>
  <rect class="panel" x="888" y="405" width="160" height="165" fill="var(--peach)"/><text class="pulse" x="968" y="465" text-anchor="middle" font-size="38">↺</text><text x="968" y="510" text-anchor="middle" font-size="17">iterate</text><text x="968" y="535" text-anchor="middle" class="small">critique → refine</text>
  <path class="dash" d="M407 487 Q452 455 500 455" marker-end="url(#arrow)"/><path class="dash" d="M795 487 Q840 455 888 455" marker-end="url(#arrow)"/>
</svg></div>
