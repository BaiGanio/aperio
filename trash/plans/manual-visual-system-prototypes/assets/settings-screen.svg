<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative Aperio settings screen</title>
  <desc id="desc">A dark settings panel with provider and storage controls, source badges, and three numbered annotation pins.</desc>
  <rect width="1200" height="600" fill="#100c20"/>
  <rect x="20" y="20" width="1160" height="56" fill="#19122f" stroke="#3b2a63"/>
  <circle cx="52" cy="48" r="10" fill="#a855f7"/><text x="76" y="57" fill="#f7f3ff" font-family="Arial,sans-serif" font-size="27" font-weight="700">Aperio</text>
  <text x="1050" y="55" fill="#a89acb" font-family="Arial,sans-serif" font-size="17">SETTINGS</text>
  <rect x="20" y="96" width="258" height="484" fill="#17112e" stroke="#34244f"/>
  <text x="52" y="142" fill="#8f82b0" font-family="Arial,sans-serif" font-size="16" letter-spacing="2">CONFIGURATION</text>
  <rect x="36" y="166" width="226" height="50" fill="#2c1d4a"/><text x="58" y="198" fill="#d9c9ff" font-family="Arial,sans-serif" font-size="20">AI and models</text>
  <text x="58" y="258" fill="#a89acb" font-family="Arial,sans-serif" font-size="20">Memory</text><text x="58" y="306" fill="#a89acb" font-family="Arial,sans-serif" font-size="20">Security</text><text x="58" y="354" fill="#a89acb" font-family="Arial,sans-serif" font-size="20">Advanced</text>
  <rect x="300" y="96" width="880" height="484" fill="#fbf9ff"/>
  <text x="340" y="146" fill="#201832" font-family="Arial,sans-serif" font-size="30" font-weight="700">AI and storage</text>
  <text x="340" y="181" fill="#62576f" font-family="Arial,sans-serif" font-size="17">Choose where Aperio thinks and remembers.</text>
  <text x="340" y="234" fill="#3d334a" font-family="Arial,sans-serif" font-size="16" font-weight="700">CHAT PROVIDER</text>
  <rect x="340" y="250" width="780" height="66" fill="#fff" stroke="#d7cde5"/><text x="366" y="291" fill="#201832" font-family="Arial,sans-serif" font-size="22">llama.cpp (local)</text><rect x="1010" y="270" width="82" height="26" fill="#eee6ff"/><text x="1031" y="289" fill="#7441b5" font-family="Arial,sans-serif" font-size="14">DB</text>
  <text x="340" y="358" fill="#3d334a" font-family="Arial,sans-serif" font-size="16" font-weight="700">DATABASE</text>
  <rect x="340" y="374" width="780" height="66" fill="#fff" stroke="#d7cde5"/><text x="366" y="415" fill="#201832" font-family="Arial,sans-serif" font-size="22">SQLite</text><rect x="978" y="394" width="114" height="26" fill="#e5f7f4"/><text x="995" y="413" fill="#17695f" font-family="Arial,sans-serif" font-size="14">DEFAULT</text>
  <rect x="340" y="477" width="152" height="54" fill="#7c3aed"/><text x="382" y="511" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="700">Save</text>
  <g font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle"><circle cx="334" cy="282" r="20" fill="#ec4899" stroke="#fff" stroke-width="4"/><text x="334" y="290" fill="#fff">1</text><circle cx="334" cy="406" r="20" fill="#22d3ee" stroke="#fff" stroke-width="4"/><text x="334" y="414" fill="#08151a">2</text><circle cx="1112" cy="282" r="20" fill="#34d399" stroke="#fff" stroke-width="4"/><text x="1112" y="290" fill="#082018">3</text></g>
</svg>
