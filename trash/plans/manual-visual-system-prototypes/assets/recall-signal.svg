<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Aperio recall signal path</title>
  <desc id="desc">Four numbered stations show an agent storing a memory, Aperio indexing it, a later conversation asking a related question, and Aperio returning ranked recall.</desc>
  <defs><linearGradient id="aurora" x1="0" x2="1"><stop stop-color="#7c3aed"/><stop offset=".52" stop-color="#ec4899"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#463b57"/></marker></defs>
  <path d="M235 176H365M535 176H665M835 176H965" fill="none" stroke="#463b57" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1045 280C1015 380 185 380 155 280" fill="none" stroke="url(#aurora)" stroke-width="12" stroke-linecap="round"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g transform="translate(55 66)"><rect width="180" height="220" fill="#fff" stroke="#463b57" stroke-width="4"/><circle cx="34" cy="34" r="20" fill="#7c3aed"/><text x="34" y="42" fill="#fff" font-size="23" font-weight="700">1</text><path d="M60 87h60M60 113h75M60 139h45" stroke="#463b57" stroke-width="8" stroke-linecap="round"/><text x="90" y="188" fill="#221a2d" font-size="24" font-weight="700">STORE</text></g>
    <g transform="translate(355 66)"><rect width="180" height="220" fill="#fff" stroke="#463b57" stroke-width="4"/><circle cx="34" cy="34" r="20" fill="#ec4899"/><text x="34" y="42" fill="#fff" font-size="23" font-weight="700">2</text><ellipse cx="92" cy="95" rx="48" ry="18" fill="none" stroke="#463b57" stroke-width="7"/><path d="M44 95v55c0 10 21 18 48 18s48-8 48-18V95" fill="none" stroke="#463b57" stroke-width="7"/><text x="90" y="188" fill="#221a2d" font-size="24" font-weight="700">INDEX</text></g>
    <g transform="translate(655 66)"><rect width="180" height="220" fill="#fff" stroke="#463b57" stroke-width="4"/><circle cx="34" cy="34" r="20" fill="#22d3ee"/><text x="34" y="42" fill="#102329" font-size="23" font-weight="700">3</text><circle cx="83" cy="113" r="42" fill="none" stroke="#463b57" stroke-width="8"/><path d="M114 145l32 32" stroke="#463b57" stroke-width="10" stroke-linecap="round"/><text x="90" y="188" fill="#221a2d" font-size="24" font-weight="700">ASK</text></g>
    <g transform="translate(955 66)"><rect width="180" height="220" fill="#fff" stroke="#463b57" stroke-width="4"/><circle cx="34" cy="34" r="20" fill="#34d399"/><text x="34" y="42" fill="#10251e" font-size="23" font-weight="700">4</text><path d="M55 95h75l-12 62H67z" fill="none" stroke="#463b57" stroke-width="7"/><path d="M76 80v-16h38v16" fill="none" stroke="#463b57" stroke-width="7"/><text x="90" y="188" fill="#221a2d" font-size="24" font-weight="700">RECALL</text></g>
    <text x="600" y="413" fill="#5f536c" font-size="22" letter-spacing="3">THE NEXT CONVERSATION REMEMBERS</text>
  </g>
</svg>
