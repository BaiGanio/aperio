name: (ci) npm audit

# DEP-02 — surface known-vulnerable dependencies on every PR/push and weekly.
# Fails the check only on high/critical advisories so a low-severity transitive
# bump doesn't block merges; Dependabot handles the routine upgrades.
#
# The gate runs through scripts/npm-audit-gate.js rather than `npm audit
# --audit-level=high` directly, so a high advisory with no upstream fix at all
# can be accepted explicitly, with a reason and an expiry date, instead of
# leaving the whole check permanently red. See that file for the current list.

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: "0 6 * * 1"   # Monday 06:00 UTC

permissions:
  contents: read

jobs:
  audit:
    name: Audit production dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - name: npm audit (high+ severity, with dated exceptions)
        run: node scripts/npm-audit-gate.js
