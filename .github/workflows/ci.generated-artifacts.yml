name: (ci) generated artifacts

# Lockstep gate for every file in the repo that is generated from a source of
# truth rather than hand-written:
#
#   lib/config.js              → .env.example, docs/config-reference.md
#   id/agent-rules/*.md        → integrations/agent-rules/**
#   docs/assets/mascot/*       → the derived mascot set in docs/ and public/
#
# Every generator exposes a --check mode that byte-compares the committed
# artifact against a fresh build, so a change to a source without a
# regeneration fails here instead of drifting silently. Path-filtered, per the
# per-concern workflow convention of ci.agent-harness.yml / ci.lite-smoke.yml.

on:
  workflow_dispatch:
  push:
    branches: [master, dev]
    paths:
      - lib/config.js
      - id/agent-rules/**
      - integrations/agent-rules/**
      - scripts/gen-env-example.js
      - scripts/gen-agent-rules.js
      - scripts/gen-mascot-derivatives.js
      - .env.example
      - docs/config-reference.md
      - docs/assets/mascot/**
      - public/assets/mascot/**
      - .github/workflows/ci.generated-artifacts.yml
  pull_request:
    branches: [master, dev]
    paths:
      - lib/config.js
      - id/agent-rules/**
      - integrations/agent-rules/**
      - scripts/gen-env-example.js
      - scripts/gen-agent-rules.js
      - scripts/gen-mascot-derivatives.js
      - .env.example
      - docs/config-reference.md
      - docs/assets/mascot/**
      - public/assets/mascot/**
      - .github/workflows/ci.generated-artifacts.yml

permissions:
  contents: read

jobs:
  check:
    name: Generated artifacts are in lockstep
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No generator needs a database, a model, or the network — they read a
      # source file and render text or images, so this stays a sub-minute job.
      - name: .env.example and docs/config-reference.md match lib/config.js
        run: npm run gen:env:check

      - name: integrations/agent-rules/** matches id/agent-rules/aperio-memory.md
        run: npm run gen:agent-rules:check

      - name: derived mascot assets match the masters
        run: npm run gen:mascot:check
