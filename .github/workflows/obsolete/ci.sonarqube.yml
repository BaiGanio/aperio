name: (ci) SonarQube analysis

# PARKED 2026-10-22 — Aperio Reset S1.3. Codacy and SonarQube are retired as quality
# gates: both were already `disabled_manually` on GitHub and neither had run since
# 2026-07-05. The file is kept so the work is not lost. Triggers are stripped to manual
# dispatch only, and files under .github/workflows/obsolete/ are not scanned by GitHub
# Actions at all, so this never runs. To revive it, restore the original `on:` block
# from tag archive/pre-reset-2026-10-22 and move the file back up.
on:
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  Analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }} 
        with:
          args:
            -Dsonar.projectKey=BaiGanio_aperio
            -Dsonar.organization=baiganio
            -Dsonar.scm.provider=git
            -Dsonar.javascript.lcov.reportPaths=./coverage/lcov.info
            -Dsonar.exclusions=**/*.sql