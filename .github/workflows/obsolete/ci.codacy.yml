name: (ci) Codacy Security Scan

# PARKED 2026-10-22 — Aperio Reset S1.3. Codacy and SonarQube are retired as quality
# gates: both were already `disabled_manually` on GitHub and neither had run since
# 2026-07-05. The file is kept so the work is not lost. Triggers are stripped to manual
# dispatch only, and files under .github/workflows/obsolete/ are not scanned by GitHub
# Actions at all, so this never runs. To revive it, restore the original `on:` block
# from tag archive/pre-reset-2026-10-22 and move the file back up.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read
      security-events: write 
      actions: read 
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@d840f886c4bd4edc059706d09c6a1586111c540b # d840f886c4bd4edc059706d09c6a1586111c540b
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647

      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: sarif-results
