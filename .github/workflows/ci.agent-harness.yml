name: (ci) agent loop regression harness

# Deterministic regression net for the agent loop (agent-harness-epic WS0,
# trash/plans/agent-harness-epic/). No network, no live model, no real MCP
# subprocess — a scripted mock provider drives the real runAgentLoop,
# middleware, and tool hooks. Path-filtered (not the shared ci.codecov.yml
# job) so it only runs on changes to the code it actually watches, mirroring
# ci.lite-smoke.yml's per-concern workflow convention.

on:
  workflow_dispatch:
  push:
    branches: [master, dev]
    paths:
      - lib/agent/**
      - lib/tools/**
      - lib/context/**
      - lib/providers/**
      - tests/harness/**
      - .github/workflows/ci.agent-harness.yml
  pull_request:
    branches: [master, dev]
    paths:
      - lib/agent/**
      - lib/tools/**
      - lib/context/**
      - lib/providers/**
      - tests/harness/**
      - .github/workflows/ci.agent-harness.yml

permissions:
  contents: read

jobs:
  harness:
    name: Deterministic loop harness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the deterministic harness
        run: npm run test:harness
