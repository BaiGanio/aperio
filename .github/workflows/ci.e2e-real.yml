name: (ci) Real-app E2E (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-app-e2e:
    name: Real-app E2E (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26] # 24 = supported floor, 26 = early-warning target
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run real-app E2E tests
        run: npm run test:e2e:real
