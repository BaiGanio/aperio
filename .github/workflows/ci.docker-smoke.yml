name: (ci) Docker smoke

on:
  workflow_dispatch:
    inputs:
      ghcr_digest:
        description: Optional explicit GHCR image reference or digest to smoke
        required: false
        default: ""
        type: string
  pull_request:
    branches: [master, dev]
    paths:
      - docker/**
      - vms/docker/**
      - server.js
      - db/**
      - lib/**
      - package.json
      - package-lock.json
      - .github/workflows/ci.docker-smoke.yml

permissions:
  contents: read
  packages: read

jobs:
  local-image:
    name: build and smoke local image
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build local image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: aperio:test-local
      - name: Smoke local image
        run: bash vms/docker/run.sh --image aperio:test-local

  published-image:
    name: smoke explicit GHCR image
    if: github.event_name == 'workflow_dispatch' && inputs.ghcr_digest != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Smoke published image
        env:
          GHCR_IMAGE: ${{ inputs.ghcr_digest }}
        run: bash vms/docker/run.sh --image "$GHCR_IMAGE"
