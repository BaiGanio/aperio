name: (ci) Browser E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "public/**"
      - "lib/routes/**"
      - "lib/server.js"
      - "server.js"
      - "tests/browser/**"
      - "tests/playwright.config.js"
      - "tests/reporters/browser-json.js"
      - "tests/e2e/helpers/real-app-helper.js"
      - "tests/e2e/helpers/test-agent.js"
      - "tests/e2e/fixtures/real-app-server.js"
      - "scripts/generate-browser-dashboard.js"
      - "docs/benchmarks/browser/**"
      - "docs/styles-dashboards.css"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.browser.yml"
  push:
    paths:
      - "public/**"
      - "lib/routes/**"
      - "lib/server.js"
      - "server.js"
      - "tests/browser/**"
      - "tests/playwright.config.js"
      - "tests/reporters/browser-json.js"
      - "tests/e2e/helpers/real-app-helper.js"
      - "tests/e2e/helpers/test-agent.js"
      - "tests/e2e/fixtures/real-app-server.js"
      - "scripts/generate-browser-dashboard.js"
      - "docs/benchmarks/browser/**"
      - "docs/styles-dashboards.css"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.browser.yml"

permissions:
  contents: read

jobs:
  browser:
    name: Playwright Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Cache Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Run browser tests
        run: npm run test:browser:ci:dashboard

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-browser-failure
          path: |
            playwright/
            tests/test-results/playwright/
          if-no-files-found: warn
          retention-days: 7
